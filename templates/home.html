
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Expenditure Management</title>

    <style>
        #content-container {
            border: 1px solid #ccc;
            padding: 20px;
            margin-top: 20px;
        }

        .center-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 10vh; /* Adjust height as needed */
        }

        .center-buttons button {
            margin: 20px; /* Add some space between buttons */
        }

    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="overflow: hidden;
    position: sticky;
    top:0;">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-credit-card" style="color: rgb(255, 183, 0);"></i>
                <p style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">EXPENDITURE MANAGEMENT</p>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="logout">Logout</a></li>
                    <li class="nav-item"><a class="nav-link" href="home">AboutUs</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {% block content %}

    <div class="center-buttons">
        <button onclick="loadContent('income')">Income</button>
        <button onclick="loadContent('budget')">Budget</button>
        <button onclick="loadContent('expenses')">Expenses</button>
        <button onclick="loadContent('savings')">Savings</button>
    </div>

{% endblock %}
    <div id="content-container">
        </div>

    <script>
        function loadContent(filename) {
            fetch(filename)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('content-container').innerHTML = data;
                })
                .catch(error => {
                    document.getElementById('content-container').innerHTML = `<p>Error loading ${filename}: ${error}</p>`;
                });
        }
    </script>
</body>
</html>
