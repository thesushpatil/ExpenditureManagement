{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body style="background-color:#1E1E1E">
<h2 class="logo" style="margin-top: 3rem; text-align: center; color: white;"><i style="color: rgb(0,85,255); margin-right: 24rem;" class="fa-solid fa-credit-card"></i><br>EXPENDITURE MANAGEMENT</h2>
    <h3 style="text-align: center;color: white ; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Create an Account</h3>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">

                        <form method="post">
                            {% csrf_token %}

{#                        For displaying the messages#}

                             {% if messages %}
                                 {{ messages.tags }}
                                <div class="alert alert-primary" role="alert">
                                    {% for message in messages %}
                                    {{ message }}
                                    {% endfor %}
                                </div>
                            {% endif %}

                             <div class="form-group mb-3">
                                <label for="name">Name</label>
                                <input type="text" name="name" class="form-control" id="name" required>
                            </div>
                            <div class="form-group mb-3">
                                <label for="username">Username</label>
                                <input type="text" name="username" class="form-control" id="username" required>
                            </div>

                        <div class="form-group mb-3">
                                <label for="lname">Last Name</label>
                                <input type="text" name="lname" class="form-control" id="lname" required>
                            </div>

                            <div class="form-group mb-3">
                                <label for="email">Email</label>
                                <input type="email" name="email" class="form-control" id="email" required>
                            </div>
                            <div class="form-group mb-3">
                                <label for="password">Password</label>
                                <input type="password" name="password" class="form-control" id="password" required>
                            </div>
                        <div class="form-group mb-3">
                                <label for="confirmPassword">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control" id="confirm_password" required>
                            </div>


                            <button type="submit" class="btn btn-primary w-10">Register</button>
                             <a href="/login" class="btn btn-danger  w-10">LOGIN</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
