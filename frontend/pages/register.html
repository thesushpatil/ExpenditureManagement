<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ExpManage</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left register-left">
            <div class="auth-brand">
                <i class="fas fa-wallet"></i>
                <h2>Join ExpManage</h2>
                <p>Start your journey to better financial health. Track, save, and grow your wealth.</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form-container">
                <h1>Create account</h1>
                <p class="auth-subtitle">Start managing your finances today</p>
                <form id="register-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" id="reg-firstname" placeholder="John" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" id="reg-lastname" placeholder="Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="reg-username" placeholder="johndoe" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="reg-email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <div class="password-input">
                            <input type="password" id="reg-password" placeholder="Min 8 characters" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <input type="password" id="reg-password-confirm" placeholder="Repeat password" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full" id="register-btn">Create Account</button>
                </form>
                <p class="auth-switch">
                    Already have an account? <a href="login.html">Sign in</a>
                </p>
                <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to home</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="../js/api.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        }

        if (getAccessToken()) { window.location.href = 'dashboard.html'; }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            btn.textContent = 'Creating account...';
            btn.disabled = true;

            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-password-confirm').value;
            if (password !== confirm) {
                showToast('Passwords do not match', 'error');
                btn.textContent = 'Create Account'; btn.disabled = false;
                return;
            }

            const result = await apiRegister({
                first_name: document.getElementById('reg-firstname').value,
                last_name: document.getElementById('reg-lastname').value,
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                password: password,
                password_confirm: confirm,
            });

            if (result.ok) {
                window.location.href = 'dashboard.html';
            } else {
                const data = result.data;
                let msg = 'Registration failed';
                // Extract the actual error message from DRF response
                if (data?.error?.details) {
                    const details = data.error.details;
                    const allErrors = [];
                    Object.entries(details).forEach(([field, errors]) => {
                        if (Array.isArray(errors)) {
                            errors.forEach(e => allErrors.push(`${field}: ${e}`));
                        } else if (typeof errors === 'string') {
                            allErrors.push(errors);
                        }
                    });
                    msg = allErrors[0] || msg;
                } else if (data?.password) {
                    msg = data.password[0];
                } else if (data?.username) {
                    msg = data.username[0];
                } else if (data?.email) {
                    msg = data.email[0];
                }
                showToast(msg, 'error');
                btn.textContent = 'Create Account'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
