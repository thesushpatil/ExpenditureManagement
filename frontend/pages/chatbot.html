<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - ExpManage</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chatbot.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.2.12/marked.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-wallet"></i><span>ExpManage</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="income.html" class="nav-item"><i class="fas fa-wallet"></i> Income</a>
                <a href="expenses.html" class="nav-item"><i class="fas fa-receipt"></i> Expenses</a>
                <a href="savings.html" class="nav-item"><i class="fas fa-piggy-bank"></i> Savings</a>
                <a href="budgets.html" class="nav-item"><i class="fas fa-bullseye"></i> Budgets</a>
                <a href="chatbot.html" class="nav-item active"><i class="fas fa-robot"></i> AI Assistant</a>
                <a href="about.html" class="nav-item"><i class="fas fa-info-circle"></i> About Us</a>
            </nav>
            <div class="sidebar-footer"><button class="btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
        </aside>

        <main class="main-content" style="padding:0; display:flex; flex-direction:column; height:100vh;">
            <header class="topbar">
                <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
                <h2><i class="fas fa-robot" style="color:var(--primary);margin-right:8px;"></i> EM AI Assistant</h2>
                <div style="display:flex;gap:8px;">
                    <button class="btn-secondary" style="padding:8px 12px;margin:0;" onclick="startNewChat()"><i class="fas fa-plus"></i> New Chat</button>
                </div>
            </header>

            <div class="chat-messages" id="chat-messages">
                <div class="chat-intro">
                    <div class="chat-intro-icon"><i class="fas fa-robot"></i></div>
                    <h2>EM AI Assistant</h2>
                    <p>I can help you log finances, set budgets, and offer financial guidance. Ask me anything!</p>
                    <div class="suggestion-chips">
                        <button class="chip" onclick="sendSuggestion('How to add expenses')">How to add expenses</button>
                        <button class="chip" onclick="sendSuggestion('How to set Budget')">How to set Budget</button>
                        <button class="chip" onclick="sendSuggestion('Pros of Expenditure Management')">Pros of Expenditure Management</button>
                        <button class="chip" onclick="sendSuggestion('Strategies for Better Financial Growth')">Financial Growth Tips</button>
                    </div>
                </div>
            </div>

            <div class="chat-typing" id="chat-typing" style="display:none;">
                <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-container">
                    <textarea id="chat-input" placeholder="Ask about expenses, budgets, savings..." rows="1"></textarea>
                    <button id="chat-send" onclick="sendMessage()" disabled><i class="fas fa-paper-plane"></i></button>
                </div>
                <p class="chat-disclaimer">Powered by Gemini AI. Responses may not always be accurate.</p>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/chatbot.js"></script>
    <script>requireAuth(); loadUserName();</script>
</body>
</html>
