<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - ExpManage</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-wallet"></i><span>ExpManage</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="income.html" class="nav-item"><i class="fas fa-wallet"></i> Income</a>
                <a href="expenses.html" class="nav-item active"><i class="fas fa-receipt"></i> Expenses</a>
                <a href="savings.html" class="nav-item"><i class="fas fa-piggy-bank"></i> Savings</a>
                <a href="budgets.html" class="nav-item"><i class="fas fa-bullseye"></i> Budgets</a>
                <a href="khatabook.html" class="nav-item"><i class="fas fa-book"></i> Khatabook</a>
                <a href="chatbot.html" class="nav-item"><i class="fas fa-robot"></i> AI Assistant</a>
                <a href="about.html" class="nav-item"><i class="fas fa-info-circle"></i> About Us</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
                <h2>Expenses</h2>
                <div class="user-info"><div class="user-avatar"><i class="fas fa-user"></i></div><span id="user-name">User</span></div>
            </header>

            <section class="content-section active">
                <div class="section-header">
                    <div><h2>Expenses</h2><p>Track and manage your spending</p></div>
                    <button class="btn-primary" onclick="toggleForm('expense-form')"><i class="fas fa-plus"></i> Add Expense</button>
                </div>

                <div id="expense-form" class="form-card hidden">
                    <h3>New Expense</h3>
                    <form id="add-expense-form">
                        <div class="form-grid">
                            <div class="form-group"><label>Amount *</label><input type="number" id="exp-amount" step="0.01" min="0.01" placeholder="0.00" required></div>
                            <div class="form-group"><label>Category *</label><select id="exp-category" required><option value="">Select category</option></select></div>
                            <div class="form-group"><label>Date *</label><input type="date" id="exp-date" required></div>
                            <div class="form-group"><label>Description</label><input type="text" id="exp-description" placeholder="Optional note"></div>
                        </div>
                        <button type="submit" class="btn-primary">Add Expense</button>
                        <button type="button" class="btn-secondary" onclick="toggleForm('expense-form')">Cancel</button>
                    </form>
                </div>

                <!-- PDF Export -->
                <div class="card" style="margin-bottom:16px; padding:16px;">
                    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                        <label style="font-size:14px; font-weight:500;">Export Monthly PDF:</label>
                        <input type="month" id="pdf-month" class="input-field-inline">
                        <button class="btn-primary" onclick="exportExpensePDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>
                    </div>
                </div>

                <div class="filters-bar">
                    <input type="text" id="exp-search" placeholder="Search expenses..." oninput="loadExpenses()">
                    <select id="exp-filter-category" onchange="loadExpenses()"><option value="">All Categories</option></select>
                    <input type="month" id="exp-filter-month" onchange="loadExpenses()">
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>Category</th><th>Description</th><th>Date</th><th>Amount</th><th>Actions</th></tr></thead>
                            <tbody id="expenses-table"></tbody>
                        </table>
                    </div>
                    <p id="expenses-empty" class="empty-state hidden"><i class="fas fa-receipt"></i><br>No expenses found. Start tracking your spending!</p>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        requireAuth();
        loadUserName();
        loadCategoriesForPage();
        document.getElementById('exp-date').value = getTodayDate();
        loadExpenses();

        document.getElementById('add-expense-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                amount: parseFloat(document.getElementById('exp-amount').value),
                category: parseInt(document.getElementById('exp-category').value),
                date: document.getElementById('exp-date').value,
                description: document.getElementById('exp-description').value,
            };
            const result = await apiCreateExpense(data);
            if (result.ok) {
                showToast('Expense added!');
                document.getElementById('exp-amount').value = '';
                document.getElementById('exp-description').value = '';
                toggleForm('expense-form');
                loadExpenses();
            } else {
                const msg = result.data?.error?.details?.amount?.[0] || result.data?.error?.message || 'Failed to add expense';
                showToast(msg, 'error');
            }
        });

        async function loadCategoriesForPage() {
            const cats = await apiGetCategories();
            ['exp-category', 'exp-filter-category'].forEach(id => {
                const sel = document.getElementById(id);
                const first = sel.options[0];
                sel.innerHTML = '';
                sel.appendChild(first);
                cats.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; sel.appendChild(o); });
            });
        }
    </script>
</body>
</html>
