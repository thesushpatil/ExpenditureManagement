<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ExpManage</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <i class="fas fa-wallet"></i>
                <h2>ExpManage</h2>
                <p>Your smart companion for tracking expenses, managing budgets, and achieving financial goals.</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form-container">
                <h1>Welcome back</h1>
                <p class="auth-subtitle">Sign in to your account to continue</p>
                <form id="login-form">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="login-username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-input">
                            <input type="password" id="login-password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary btn-full" id="login-btn">Sign In</button>
                </form>
                <p class="auth-switch">
                    Don't have an account? <a href="register.html">Create one</a>
                </p>
                <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to home</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        }

        // Redirect if already logged in
        if (getAccessToken()) { window.location.href = 'dashboard.html'; }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.textContent = 'Signing in...';
            btn.disabled = true;

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const result = await apiLogin(username, password);
            if (result.ok) {
                window.location.href = 'dashboard.html';
            } else {
                const msg = result.data.detail || result.data.error?.message || 'Invalid credentials';
                showToast(msg, 'error');
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
